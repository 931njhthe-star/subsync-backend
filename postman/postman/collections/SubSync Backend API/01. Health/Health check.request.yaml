$kind: http-request
description: 서버가 요청을 받을 수 있는지 확인합니다.
url: "{{base_url}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('상태 코드는 200이다', function () {
          pm.response.to.have.status(200);
      });

      pm.test('응답은 JSON이다', function () {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.include('application/json');
      });

      const body = pm.response.json();
      pm.test('status가 ok이다', function () {
          pm.expect(body.status).to.eql('ok');
      });
    language: text/javascript
order: 1000
