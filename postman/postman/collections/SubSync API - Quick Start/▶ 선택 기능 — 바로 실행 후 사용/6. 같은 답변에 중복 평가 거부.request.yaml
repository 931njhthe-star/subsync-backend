$kind: http-request
description: 이미 평가한 Tutor 답변은 수정하거나 다시 선택할 수 없습니다.
url: "{{base_url}}/api/v1/tutor/feedback"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "conversation_id": "{{conversation_id}}",
      "message_id": "{{message_id}}",
      "rating": "not_helpful"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('중복 평가는 거부된다', function () {
        pm.response.to.have.status(409);
      });
    language: text/javascript
order: 5000
