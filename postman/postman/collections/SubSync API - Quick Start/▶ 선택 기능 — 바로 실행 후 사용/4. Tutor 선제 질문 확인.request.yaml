$kind: http-request
description: 재생 중 Tutor가 먼저 제안할 질문이 있는지 확인합니다.
url: "{{base_url}}/api/v1/tutor/proactive"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "video_id": "{{video_id}}",
      "timestamp": 42.1,
      "recent_subtitles": [
        {
          "time": 42.1,
          "en": "English spelling is famously inconsistent.",
          "ko": "영어 철자는 유난히 일관성이 없습니다."
        }
      ],
      "playback_state": "playing"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('선제 질문 판단 결과를 받는다', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body).to.have.property('should_show');
        if (body.should_show) {
          pm.collectionVariables.set('proactive_question_id', body.question_id);
        }
      });
    language: text/javascript
order: 2000
