$kind: http-request
description: 4번 응답의 question_id를 proactive_question_id 변수에 넣어 명시적으로 답변 모드로 호출합니다. reply는 자연스러운 피드백이고 proactive_feedback에는 선택적인 정답 근거가 포함됩니다.
url: "{{base_url}}/api/v1/tutor/ask"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "video_id": "{{video_id}}",
      "timestamp": 42.1,
      "proactive_question_id": "{{proactive_question_id}}",
      "user_message": "영어 철자는 일관성이 없다는 뜻이라고 생각해요.",
      "recent_subtitles": [
        {
          "time": 42.1,
          "en": "English spelling is famously inconsistent.",
          "ko": "영어 철자는 유난히 일관성이 없습니다."
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('선제 질문 답안 피드백을 받는다', function () {
        pm.response.to.have.status(200);
        const body = pm.response.json();
        pm.expect(body.reply).to.be.a('string').and.not.empty;
        pm.expect(body.reply).to.not.include('판정:');
        pm.expect(body.reply).to.not.include('판정 불가');
        const feedback = body.proactive_feedback;
        if (feedback !== null) {
          pm.expect(['correct', 'partial', 'incorrect']).to.include(feedback.result);
          pm.expect(feedback.criteria).to.be.a('string').and.not.empty;
        }
      });
    language: text/javascript
order: 3000
