$kind: http-request
description: 열린 login_history 행에 logout_at을 기록합니다. 7번을 먼저 실행합니다.
url: "{{base_url}}/api/v1/auth/logout"
method: POST
headers:
  Authorization: Bearer {{access_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('로그아웃 이력이 기록된다', function () {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().ok).to.eql(true);
      });
    language: text/javascript
order: 6000
