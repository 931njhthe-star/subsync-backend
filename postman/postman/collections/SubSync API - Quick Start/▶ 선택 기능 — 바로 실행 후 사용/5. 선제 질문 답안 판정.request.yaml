$kind: http-request
description: 4번 응답의 question_id를 proactive_question_id 변수에 넣은 뒤 실행합니다. 응답의 proactive_feedback에 정답·부분 정답·오답과 판단 기준이 반환됩니다.
url: "{{base_url}}/api/v1/tutor/ask"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "video_id": "{{video_id}}",
      "timestamp": 42.1,
      "proactive_question_id": "{{proactive_question_id}}",
      "user_message": "잘 모르겠어요.",
      "recent_subtitles": [
        {
          "time": 42.1,
          "en": "English spelling is famously inconsistent.",
          "ko": "영어 철자는 유난히 일관성이 없습니다."
        }
      ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('선제 질문 답안 판정을 받는다', function () {
        pm.response.to.have.status(200);
        const feedback = pm.response.json().proactive_feedback;
        pm.expect(feedback).to.not.equal(null);
        pm.expect(['correct', 'partial', 'incorrect', 'unavailable']).to.include(feedback.result);
        pm.expect(feedback.criteria).to.be.a('string').and.not.empty;
      });
    language: text/javascript
order: 3000
